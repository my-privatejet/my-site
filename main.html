<style>
  :root {
    --bg-primary: #0a0a0f;
    --border-color: #2d9eb5 !important;
    --color-primary: #24c7ff !important
  }
  *,
  *::before,
  *::after {
      box-sizing: border-box;
  }
  body {
    background: var(--bg-primary);
    color: white;
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    position: fixed;
    justify-content: space-between;
    width: 100%;
    background: linear-gradient(180deg, rgba(10, 10, 15, 0.98) 0%, rgba(18, 18, 26, 0.95) 100%) !important;
    backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    row-gap: 10px;
    border-bottom: 1px solid var(--border-color) !important;
    padding: 20px 0;
  }
  header div:nth-of-type(1) {
    padding-left: 20px;
    cursor: pointer;
  }
  header div:nth-of-type(2) {
    padding-right: 20px;
  }
  header .title {
    color: var(--color-primary);
    font-weight: 900 !important;
    font-size: 20px !important;
    letter-spacing: 6px;
  }
  header .action-box {
    display: flex;
    column-gap: 20px;
    align-items: center;
  }
  header .action-box .logout {
    display: flex;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    border: 0;
    font-size: 14px;
    color: white;
    background: #0a0a0f;
  }
  header .action-box .logout i {
    font-size: 20px;
  }
  main {
    max-width: 1000px;
    width: 100%;
    padding: 20px;
  }
  main section input {
    padding: 10px;
    border: 0;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    transition: all 0.3s;
    width: 100%;
  }
  main .example-element-1 {

    flex-direction: column;
    row-gap: 20px;
    padding: 20px;
    border: 1px solid var(--border-color);
    border-radius: 20px;

    justify-content: space-between;
    align-items: center;
  }
  main .example-element-1 .action-box-1 .element-1 {

    align-items: center;
    column-gap: 10px;
  }

    padding: 10px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    background: #717171;
    color: white;
    border: 0;
    cursor: pointer;
  }

    font-size: 15px;
    padding-right: 5px;
  }
  main .example-element-1 .action-box-3 button {

    border-radius: 10px;
    background: var(--color-primary);
    color: white;
    font-size: 18px;
    border: 0;
    cursor: pointer;
    width: 100%;
  }
  main .example-element-1 .action-box-2 {
    background: white;
    color: black;
    padding: 20px;
    border-radius: 10px;
    max-height: 500px;
    overflow-y: scroll;

  .h-70px {
    height: 70px;
  }
  .toggleSwitch {
    width: 44px;
    height: 22px;
    display: block;
    position: relative;
    border-radius: 30px;
    background-color: #fff;
    box-shadow: 0 0 16px 3px rgba(0 0 0 / 15%);
    cursor: pointer;
  }
  .toggleSwitch .toggleButton {
    width: 18px;
    height: 18px;
    position: absolute;
    top: 50%;
    left: 4px;
    transform: translateY(-50%);
    border-radius: 50%;
    background: var(--color-primary);
  }
  #toggle:checked ~ .toggleSwitch {
    background: var(--color-primary);
  }
  #toggle:checked ~ .toggleSwitch .toggleButton {
    left: calc(100% - 24px);
    background: #fff;

  .toggleSwitch, .toggleButton {
